name: Publish Siliang Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag whose successful Siliang CI artifacts should be published"
        required: true
        default: "v0.1.5"
        type: string

concurrency:
  group: siliang-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish verified CI artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact release tag
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag || github.ref_name }}'
          if ($tag -notmatch '^v[0-9A-Za-z][0-9A-Za-z._-]*$') {
              throw "Unsafe release tag: $tag"
          }

          $headSha = (& git rev-parse HEAD).Trim()
          $tagSha = (& git rev-parse "$tag^{commit}" 2>$null).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagSha)) {
              throw "Release tag '$tag' cannot be resolved to a commit in the checkout."
          }
          if ($tagSha -cne $headSha) {
              throw "Release tag '$tag' resolves to $tagSha, but checkout HEAD is $headSha."
          }

          $releaseNotesPath = "./docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $releaseNotesPath -PathType Leaf)) {
              throw "Release notes were not found: $releaseNotesPath"
          }

          Write-Host "Verified exact release tag $tag at $headSha"

      - name: Wait for matching Siliang CI tag run
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          echo "Waiting for successful Siliang CI tag run at $release_sha."

          for attempt in $(seq 1 240); do
            state="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs" -f event=push -f head_sha="$release_sha" -f per_page=20 | jq -r --arg tag "$TAG" '.workflow_runs[] | select(.head_branch == $tag) | [.id, .status, (.conclusion // "")] | @tsv' | head -n 1)"

            if [ -z "$state" ]; then
              echo "Matching Siliang CI tag run is not visible yet (attempt $attempt)."
              sleep 15
              continue
            fi

            IFS=$'\t' read -r ci_run_id ci_status ci_conclusion <<< "$state"
            echo "Siliang CI run $ci_run_id: status=$ci_status conclusion=${ci_conclusion:-pending}"

            if [ "$ci_status" = "completed" ]; then
              if [ "$ci_conclusion" != "success" ]; then
                echo "Siliang CI for $TAG did not succeed; refusing to publish artifacts." >&2
                exit 1
              fi

              echo "run_id=$ci_run_id" >> "$GITHUB_OUTPUT"
              echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 15
          done

          echo "Timed out waiting for the matching Siliang CI tag run." >&2
          exit 1

      - name: Download verified artifacts from matching CI run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.ci.outputs.run_id }}
          pattern: siliang-engine-${{ inputs.tag || github.ref_name }}-*
          path: release-assets
          merge-multiple: true

      - name: Verify release artifact inventory and checksums
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          ls -lah

          cpu_zip="siliang-engine-$TAG-windows-x64-cpu.zip"
          cuda_zip="siliang-engine-$TAG-windows-x64-cuda-13.2.zip"

          test "$(find . -maxdepth 1 -name '*.zip' -type f | wc -l)" -eq 2
          test -f "$cpu_zip"
          test -f "$cuda_zip"
          test -f "$cpu_zip.sha256"
          test -f "$cuda_zip.sha256"
          test -f SHA256SUMS

          sha256sum --check "$cpu_zip.sha256"
          sha256sum --check "$cuda_zip.sha256"
          sha256sum --check SHA256SUMS

          test "$(grep -Ec '^[0-9a-f]{64}  siliang-engine-' SHA256SUMS)" -eq 2
          echo "Verified CI-produced CPU/CUDA archives and SHA256SUMS."

      - name: Replace existing draft only
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if existing_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$existing_draft" != "true" ]; then
              echo "Release $TAG already exists and is not a draft; refusing to replace it." >&2
              exit 1
            fi

            echo "Replacing existing draft release for $TAG."
            gh release delete "$TAG" --yes
          fi

      - name: Publish prerelease from verified CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "release-assets/siliang-engine-$TAG-windows-x64-cpu.zip" \
            "release-assets/siliang-engine-$TAG-windows-x64-cuda-13.2.zip" \
            "release-assets/SHA256SUMS" \
            --verify-tag \
            --title "Siliang Engine $TAG (Experimental)" \
            --notes-file "docs/releases/$TAG.md" \
            --prerelease \
            --draft

          gh release edit "$TAG" --draft=false --verify-tag
          echo "Published Siliang Engine $TAG from Siliang CI run ${{ steps.ci.outputs.run_id }} at ${{ steps.ci.outputs.release_sha }}."
