name: Publish Siliang Release

on:
  workflow_run:
    workflows: ["Siliang CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag whose successful Siliang CI artifacts should be published"
        required: true
        default: "v0.1.7"
        type: string

concurrency:
  group: siliang-release-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish verified CI artifacts
    # A finished CI run publishes only when it was a successful push of a v* tag.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}

    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact release tag
        shell: pwsh
        run: |
          $tag = $env:TAG
          if ($tag -notmatch '^v[0-9A-Za-z][0-9A-Za-z._-]*$') {
              throw "Unsafe release tag: $tag"
          }

          $headSha = (& git rev-parse HEAD).Trim()
          $tagSha = (& git rev-parse "$tag^{commit}" 2>$null).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagSha)) {
              throw "Release tag '$tag' cannot be resolved to a commit in the checkout."
          }
          if ($tagSha -cne $headSha) {
              throw "Release tag '$tag' resolves to $tagSha, but checkout HEAD is $headSha."
          }

          $releaseNotesPath = "./docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $releaseNotesPath -PathType Leaf)) {
              throw "Release notes were not found: $releaseNotesPath"
          }

          Write-Host "Verified exact release tag $tag at $headSha"

      - name: Resolve matching Siliang CI tag run
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"

          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            # The completed CI run that triggered this workflow is the artifact source.
            ci_run_id="$TRIGGER_RUN_ID"
            ci_conclusion="$TRIGGER_CONCLUSION"
            if [ "$TRIGGER_HEAD_SHA" != "$release_sha" ]; then
              echo "Siliang CI run $ci_run_id built $TRIGGER_HEAD_SHA, but $TAG is $release_sha." >&2
              exit 1
            fi
          else
            state="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs" -f event=push -f head_sha="$release_sha" -f per_page=20 | jq -r --arg tag "$TAG" '.workflow_runs[] | select(.head_branch == $tag) | [.id, .status, (.conclusion // "")] | @tsv' | head -n 1)"
            if [ -z "$state" ]; then
              echo "No Siliang CI tag run was found for $TAG at $release_sha." >&2
              exit 1
            fi
            IFS=$'\t' read -r ci_run_id ci_status ci_conclusion <<< "$state"
            if [ "$ci_status" != "completed" ]; then
              echo "Siliang CI run $ci_run_id for $TAG is $ci_status; this workflow runs again when it completes." >&2
              exit 1
            fi
          fi

          if [ "$ci_conclusion" != "success" ]; then
            echo "Siliang CI for $TAG did not succeed; refusing to publish artifacts." >&2
            exit 1
          fi

          echo "Using Siliang CI run $ci_run_id for $TAG at $release_sha."
          echo "run_id=$ci_run_id" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Download verified artifacts from matching CI run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.ci.outputs.run_id }}
          pattern: siliang-engine-${{ env.TAG }}-*
          path: release-assets
          merge-multiple: true

      - name: Verify release artifact inventory and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          ls -lah

          cpu_zip="siliang-engine-$TAG-windows-x64-cpu.zip"
          cuda_zip="siliang-engine-$TAG-windows-x64-cuda-13.2.zip"

          test "$(find . -maxdepth 1 -name '*.zip' -type f | wc -l)" -eq 2
          test -f "$cpu_zip"
          test -f "$cuda_zip"
          test -f "$cpu_zip.sha256"
          test -f "$cuda_zip.sha256"
          test -f SHA256SUMS

          sha256sum --check "$cpu_zip.sha256"
          sha256sum --check "$cuda_zip.sha256"
          sha256sum --check SHA256SUMS

          test "$(grep -Ec '^[0-9a-f]{64}  siliang-engine-' SHA256SUMS)" -eq 2
          echo "Verified CI-produced CPU/CUDA archives and SHA256SUMS."

      - name: Replace existing draft only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if existing_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$existing_draft" != "true" ]; then
              echo "Release $TAG already exists and is not a draft; refusing to replace it." >&2
              exit 1
            fi

            echo "Replacing existing draft release for $TAG."
            gh release delete "$TAG" --yes
          fi

      - name: Publish prerelease from verified CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "release-assets/siliang-engine-$TAG-windows-x64-cpu.zip" \
            "release-assets/siliang-engine-$TAG-windows-x64-cuda-13.2.zip" \
            "release-assets/SHA256SUMS" \
            --verify-tag \
            --title "Siliang Engine $TAG (Experimental)" \
            --notes-file "docs/releases/$TAG.md" \
            --prerelease \
            --draft

          gh release edit "$TAG" --draft=false --verify-tag
          echo "Published Siliang Engine $TAG from Siliang CI run ${{ steps.ci.outputs.run_id }} at ${{ steps.ci.outputs.release_sha }}."
