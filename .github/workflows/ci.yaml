name: Siliang CI

on:
  push:
    branches:
      - main
      - 'siliang/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'siliang/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siliang-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  validate-windows:
    name: Validate Windows CPU
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out full fork history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gguf-py/pyproject.toml

      - name: Install gguf-py
        shell: pwsh
        run: python -m pip install --disable-pip-version-check .\gguf-py

      - name: Verify fork-root provenance
        shell: pwsh
        run: .\scripts\verify-snapshot.ps1

      - name: Run hygiene and model-free tests
        shell: pwsh
        run: .\scripts\test.ps1 -PythonExecutable python

      - name: Configure and build CPU Release
        shell: pwsh
        run: |
          $buildDirectory = Join-Path $env:RUNNER_TEMP ("siliang-validation-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          .\scripts\build.ps1 -Backend Cpu -BuildDirectory $buildDirectory -Parallel 2
          "SILIANG_CI_BUILD=$buildDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run selected model-free CTests
        shell: pwsh
        run: .\scripts\test.ps1 -PythonExecutable python -BuildDirectory $env:SILIANG_CI_BUILD

  validate-linux:
    name: Validate Linux CPU compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out full fork history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gguf-py/pyproject.toml

      - name: Install gguf-py
        run: python -m pip install --disable-pip-version-check ./gguf-py

      - name: Run portable source contracts
        run: |
          python -m unittest -v \
            tests.test_hygiene \
            tests.test_converter \
            tests.test_release_packaging \
            tests.test_stock_arena_contract

      - name: Configure portable Linux build
        run: |
          cmake -S . -B "$RUNNER_TEMP/siliang-linux" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_CUDA=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF

      - name: Build and smoke Linux runtime
        run: |
          cmake --build "$RUNNER_TEMP/siliang-linux" --config Release --parallel 2
          "$RUNNER_TEMP/siliang-linux/bin/llama-cli" --version
          "$RUNNER_TEMP/siliang-linux/bin/llama-cli" --verbose --list-devices
          ctest --test-dir "$RUNNER_TEMP/siliang-linux" --output-on-failure \
            -R '^(test-gguf|test-log|test-arg-parser)$'

  validate-macos:
    name: Validate macOS Metal compatibility
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Check out full fork history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gguf-py/pyproject.toml

      - name: Install gguf-py
        run: python -m pip install --disable-pip-version-check ./gguf-py

      - name: Run portable source contracts
        run: |
          python -m unittest -v \
            tests.test_hygiene \
            tests.test_converter \
            tests.test_release_packaging \
            tests.test_stock_arena_contract

      - name: Configure upstream-compatible Metal build
        run: |
          cmake -S . -B "$RUNNER_TEMP/siliang-macos" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DGGML_METAL=ON \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF

      - name: Build and smoke macOS runtime
        run: |
          cmake --build "$RUNNER_TEMP/siliang-macos" --config Release --parallel 2
          "$RUNNER_TEMP/siliang-macos/bin/llama-cli" --version
          "$RUNNER_TEMP/siliang-macos/bin/llama-cli" --verbose --list-devices
          ctest --test-dir "$RUNNER_TEMP/siliang-macos" --output-on-failure \
            -R '^(test-gguf|test-log|test-arg-parser)$'

  package-windows:
    name: Package Windows ${{ matrix.label }}
    needs: [validate-windows, validate-linux, validate-macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: Cpu
            label: CPU
            slug: cpu
          - backend: Cuda
            label: CUDA 13.2 multi-arch
            slug: cuda-13.2

    steps:
      - name: Check out full fork history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify fork-root provenance
        shell: pwsh
        run: .\scripts\verify-snapshot.ps1

      - name: Install CUDA Toolkit 13.2
        if: matrix.backend == 'Cuda'
        # Jimver/cuda-toolkit v0.2.35
        uses: Jimver/cuda-toolkit@3d45d157f327c09c04b50ee6ccdea2d9d017ec76
        with:
          cuda: '13.2.0'
          use-github-cache: false
          use-local-cache: false

      - name: Build fresh Release directory
        shell: pwsh
        run: |
          $buildDirectory = Join-Path $env:RUNNER_TEMP ("siliang-release-${{ matrix.slug }}-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          $env:SOURCE_DATE_EPOCH = (& git show -s --format=%ct $env:GITHUB_SHA).Trim()
          if ('${{ matrix.backend }}' -eq 'Cuda') {
              .\scripts\build.ps1 -Backend Cuda -BuildDirectory $buildDirectory -Parallel 2
          } else {
              .\scripts\build.ps1 -Backend Cpu -BuildDirectory $buildDirectory -Parallel 2
          }
          "SILIANG_RELEASE_BUILD=$buildDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package runtime and provenance
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v[0-9A-Za-z][0-9A-Za-z._-]*$') {
              throw "Release tag is not safe for an artifact name: $tag"
          }

          $artifactName = "siliang-engine-$tag-windows-x64-${{ matrix.slug }}"
          $packageRoot = Join-Path $env:RUNNER_TEMP $artifactName
          $binTarget = Join-Path $packageRoot 'bin'
          $docsTarget = Join-Path $packageRoot 'docs'
          $releaseDocsTarget = Join-Path $docsTarget 'releases'
          $licenseTarget = Join-Path $packageRoot 'licenses'
          $provenanceTarget = Join-Path $packageRoot 'provenance'
          New-Item -ItemType Directory -Path $binTarget, $docsTarget, $releaseDocsTarget, $licenseTarget, $provenanceTarget | Out-Null

          $binSource = Join-Path $env:SILIANG_RELEASE_BUILD 'bin\Release'
          foreach ($fileName in @('llama-server.exe', 'llama-cli.exe')) {
              $source = Join-Path $binSource $fileName
              if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
                  throw "Expected release binary was not built: $source"
              }
              Copy-Item -LiteralPath $source -Destination $binTarget
          }

          $runtimeLibraries = @(Get-ChildItem -LiteralPath $binSource -Filter '*.dll' -File)
          if ($runtimeLibraries.Count -eq 0) {
              throw "No runtime libraries were found in $binSource"
          }
          foreach ($runtimeLibrary in $runtimeLibraries) {
              Copy-Item -LiteralPath $runtimeLibrary.FullName -Destination $binTarget
          }

          $expectedCpuVariants = @(
              'ggml-cpu-alderlake.dll'
              'ggml-cpu-cannonlake.dll'
              'ggml-cpu-cascadelake.dll'
              'ggml-cpu-haswell.dll'
              'ggml-cpu-icelake.dll'
              'ggml-cpu-sandybridge.dll'
              'ggml-cpu-skylakex.dll'
              'ggml-cpu-sse42.dll'
              'ggml-cpu-x64.dll'
          )
          $actualCpuVariants = @(
              Get-ChildItem -LiteralPath $binTarget -Filter 'ggml-cpu*.dll' -File |
                  Select-Object -ExpandProperty Name |
                  Sort-Object
          )
          if (($actualCpuVariants -join "`n") -cne (($expectedCpuVariants | Sort-Object) -join "`n")) {
              throw "Portable CPU backend inventory mismatch. Found: $($actualCpuVariants -join ', ')."
          }

          $cmakeCachePath = Join-Path $env:SILIANG_RELEASE_BUILD 'CMakeCache.txt'
          $expectedCacheEntries = [ordered]@{
              BUILD_SHARED_LIBS = 'ON'
              GGML_NATIVE = 'OFF'
              GGML_BACKEND_DL = 'ON'
              GGML_CPU_ALL_VARIANTS = 'ON'
          }
          foreach ($cacheEntry in $expectedCacheEntries.GetEnumerator()) {
              $cacheMatch = @(Select-String -LiteralPath $cmakeCachePath -Pattern ("^{0}:BOOL=(.+)$" -f $cacheEntry.Key))
              if ($cacheMatch.Count -ne 1 -or $cacheMatch[0].Matches[0].Groups[1].Value -cne $cacheEntry.Value) {
                  throw "Effective CMake cache does not contain $($cacheEntry.Key):BOOL=$($cacheEntry.Value)."
              }
          }

          $buildReceiptPath = Join-Path $env:SILIANG_RELEASE_BUILD 'SILIANG-BUILD-CONFIG.json'
          if (-not (Test-Path -LiteralPath $buildReceiptPath -PathType Leaf)) {
              throw "Siliang build receipt was not produced: $buildReceiptPath"
          }
          $buildReceipt = Get-Content -LiteralPath $buildReceiptPath -Raw | ConvertFrom-Json
          if ($buildReceipt.schema -cne 'siliang-build-config-v1' -or
              $buildReceipt.backend -cne '${{ matrix.backend }}') {
              throw 'Siliang build receipt identity does not match the package arm.'
          }
          $effectiveCudaArchitectures = [string]$buildReceipt.cuda_architectures
          if ('${{ matrix.backend }}' -eq 'Cuda') {
              if ($buildReceipt.cuda_architecture_source -cne 'llama.cpp-upstream') {
                  throw "Tagged CUDA releases must use upstream architecture selection, got: $($buildReceipt.cuda_architecture_source)."
              }
              $cudaArchitectureEntries = @(
                  $effectiveCudaArchitectures -split ';' |
                      Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
              )
              if ($cudaArchitectureEntries.Count -lt 2 -or
                  $effectiveCudaArchitectures -ceq 'native') {
                  throw "Expected an upstream multi-architecture CUDA release build, got: $effectiveCudaArchitectures."
              }
          } elseif ($effectiveCudaArchitectures -cne 'none' -or
                    $buildReceipt.cuda_architecture_source -cne 'not-applicable') {
              throw 'CPU release build receipt contains CUDA architecture state.'
          }

          $cudaBackend = Join-Path $binTarget 'ggml-cuda.dll'
          if ('${{ matrix.backend }}' -eq 'Cuda') {
              if (-not (Test-Path -LiteralPath $cudaBackend -PathType Leaf)) {
                  throw "CUDA backend was not packaged: $cudaBackend"
              }
          } elseif (Test-Path -LiteralPath $cudaBackend -PathType Leaf) {
              throw 'The CPU package unexpectedly contains ggml-cuda.dll.'
          }

          # The Windows runner's OpenSSL installation is selected by CMake, but
          # its runtime DLLs are not copied into bin\Release. Resolve the exact
          # installation from CMakeCache.txt instead of relying on the runner's
          # PATH, then package its license alongside the DLLs.
          $opensslIncludeMatch = Select-String -LiteralPath $cmakeCachePath -Pattern '^OPENSSL_INCLUDE_DIR:PATH=(.+)$'
          if ($opensslIncludeMatch.Count -ne 1) {
              throw "Expected one OPENSSL_INCLUDE_DIR entry in $cmakeCachePath."
          }
          $opensslIncludeDirectory = $opensslIncludeMatch.Matches[0].Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($opensslIncludeDirectory) -or
              $opensslIncludeDirectory.EndsWith('-NOTFOUND', [StringComparison]::OrdinalIgnoreCase)) {
              throw 'The release build did not resolve a usable OpenSSL installation.'
          }
          $opensslRoot = Split-Path -Parent $opensslIncludeDirectory
          $opensslBin = Join-Path $opensslRoot 'bin'
          foreach ($opensslRuntimeName in @('libssl-3-x64.dll', 'libcrypto-3-x64.dll')) {
              $opensslRuntime = Join-Path $opensslBin $opensslRuntimeName
              if (-not (Test-Path -LiteralPath $opensslRuntime -PathType Leaf)) {
                  throw "Required OpenSSL runtime was not found: $opensslRuntime"
              }
              Copy-Item -LiteralPath $opensslRuntime -Destination $binTarget
          }
          $opensslLicense = Get-ChildItem -LiteralPath $opensslRoot -File |
              Where-Object { $_.Name -imatch '^license(?:\.txt)?$' } |
              Select-Object -First 1
          if (-not $opensslLicense) {
              throw "OpenSSL license text was not found under $opensslRoot."
          }
          Copy-Item -LiteralPath $opensslLicense.FullName -Destination (Join-Path $licenseTarget 'OPENSSL-Apache-2.0.txt')
          $opensslExecutable = Join-Path $opensslBin 'openssl.exe'
          if (-not (Test-Path -LiteralPath $opensslExecutable -PathType Leaf)) {
              throw "OpenSSL executable was not found: $opensslExecutable"
          }
          $opensslVersion = (& $opensslExecutable version).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($opensslVersion)) {
              throw 'Failed to record the packaged OpenSSL version.'
          }

          $cudaRuntimeNames = [ordered]@{
              cudart = 'none'
              cublas = 'none'
              cublasLt = 'none'
          }
          if ('${{ matrix.backend }}' -eq 'Cuda') {
              $cudaSearchRoots = @(
                  (Join-Path $env:CUDA_PATH 'bin'),
                  (Join-Path $env:CUDA_PATH 'bin\x64'),
                  (Join-Path $env:CUDA_PATH 'lib')
              )
              $cudaRuntimePatterns = [ordered]@{
                  cudart = 'cudart64_*.dll'
                  cublas = 'cublas64_*.dll'
                  cublasLt = 'cublasLt64_*.dll'
              }
              foreach ($runtimePattern in $cudaRuntimePatterns.GetEnumerator()) {
                  $runtimeMatches = @()
                  foreach ($searchRoot in $cudaSearchRoots) {
                      if (Test-Path -LiteralPath $searchRoot -PathType Container) {
                          $runtimeMatches += Get-ChildItem -LiteralPath $searchRoot -Filter $runtimePattern.Value -File
                      }
                  }
                  $runtimeNames = @($runtimeMatches | Select-Object -ExpandProperty Name | Sort-Object -Unique)
                  if ($runtimeNames.Count -ne 1) {
                      throw "Expected one $($runtimePattern.Key) runtime DLL name, found: $($runtimeNames -join ', ')."
                  }
                  $cudaRuntime = $runtimeMatches |
                      Where-Object { $_.Name -ceq $runtimeNames[0] } |
                      Sort-Object -Property FullName |
                      Select-Object -First 1
                  Copy-Item -LiteralPath $cudaRuntime.FullName -Destination $binTarget
                  $cudaRuntimeNames[$runtimePattern.Key] = $cudaRuntime.Name
              }

              foreach ($runtimePattern in $cudaRuntimePatterns.GetEnumerator()) {
                  $packagedRuntimeNames = @(
                      Get-ChildItem -LiteralPath $binTarget -Filter $runtimePattern.Value -File |
                          Select-Object -ExpandProperty Name |
                          Sort-Object -Unique
                  )
                  if ($packagedRuntimeNames.Count -ne 1 -or
                      $packagedRuntimeNames[0] -cne $cudaRuntimeNames[$runtimePattern.Key]) {
                      throw "Packaged $($runtimePattern.Key) runtime inventory is not exact."
                  }
              }

              foreach ($licenseName in @('EULA.txt', 'LICENSE')) {
                  $cudaLicense = Join-Path $env:CUDA_PATH $licenseName
                  if (Test-Path -LiteralPath $cudaLicense -PathType Leaf) {
                      Copy-Item -LiteralPath $cudaLicense -Destination (Join-Path $licenseTarget "NVIDIA-CUDA-$licenseName")
                  }
              }
          }

          $selectedCpuVariant = $null
          $loadedCudaBackend = $null
          $originalPath = $env:PATH
          Push-Location $binTarget
          try {
              $env:PATH = "$binTarget;$env:SystemRoot\System32;$env:SystemRoot"
              if ('${{ matrix.backend }}' -eq 'Cuda') {
                  $cudaLoadOrder = @(
                      $cudaRuntimeNames.cudart
                      $cudaRuntimeNames.cublasLt
                      $cudaRuntimeNames.cublas
                      'ggml-cuda.dll'
                  )
                  $cudaLoadHandles = New-Object 'Collections.Generic.List[IntPtr]'
                  try {
                      foreach ($cudaLoadName in $cudaLoadOrder) {
                          $cudaLoadPath = Join-Path $binTarget $cudaLoadName
                          try {
                              $cudaLoadHandle = [Runtime.InteropServices.NativeLibrary]::Load($cudaLoadPath)
                          } catch {
                              throw "Packaged CUDA library is not loadable: $cudaLoadName. $($_.Exception.Message)"
                          }
                          if ($cudaLoadHandle -eq [IntPtr]::Zero) {
                              throw "Packaged CUDA library returned a null load handle: $cudaLoadName."
                          }
                          $cudaLoadHandles.Add($cudaLoadHandle)
                      }
                  } finally {
                      for ($cudaHandleIndex = $cudaLoadHandles.Count - 1; $cudaHandleIndex -ge 0; $cudaHandleIndex--) {
                          [Runtime.InteropServices.NativeLibrary]::Free($cudaLoadHandles[$cudaHandleIndex])
                      }
                  }
              }

              $dispatchOutput = @(& (Join-Path $binTarget 'llama-cli.exe') --verbose --list-devices 2>&1)
              if ($LASTEXITCODE -ne 0) {
                  throw "llama-cli.exe --list-devices failed from the assembled package with exit code $LASTEXITCODE."
              }
              foreach ($dispatchLine in @($dispatchOutput | ForEach-Object { $_.ToString() })) {
                  if ($dispatchLine -match 'loaded CPU backend from .*[\\/](ggml-cpu-[A-Za-z0-9._-]+\.dll)\s*$') {
                      if ($null -ne $selectedCpuVariant -and $selectedCpuVariant -cne $Matches[1]) {
                          throw "Runtime loaded more than one CPU variant: $selectedCpuVariant and $($Matches[1])."
                      }
                      $selectedCpuVariant = $Matches[1]
                  }
                  if ($dispatchLine -match 'loaded CUDA backend from .*[\\/](ggml-cuda\.dll)\s*$') {
                      if ($null -ne $loadedCudaBackend) {
                          throw 'Runtime reported the packaged CUDA backend more than once.'
                      }
                      $loadedCudaBackend = $Matches[1]
                  }
              }
          } finally {
              $env:PATH = $originalPath
              Pop-Location
          }
          if ([string]::IsNullOrWhiteSpace($selectedCpuVariant) -or
              -not (Test-Path -LiteralPath (Join-Path $binTarget $selectedCpuVariant) -PathType Leaf)) {
              throw 'Runtime CPU dispatch did not select exactly one packaged CPU backend variant.'
          }
          if ('${{ matrix.backend }}' -eq 'Cuda') {
              if ($loadedCudaBackend -cne 'ggml-cuda.dll') {
                  throw 'Runtime did not load exactly the packaged ggml-cuda.dll backend.'
              }
          } elseif ($null -ne $loadedCudaBackend) {
              throw 'The CPU package unexpectedly reported a loaded CUDA backend.'
          }

          Copy-Item -LiteralPath '.\README.md', '.\THIRD_PARTY_NOTICES.md', '.\LICENSE' -Destination $packageRoot
          foreach ($licenseFile in (Get-ChildItem -LiteralPath '.\licenses' -File)) {
              Copy-Item -LiteralPath $licenseFile.FullName -Destination $licenseTarget
          }
          Copy-Item -LiteralPath '.\vendor\cpp-httplib\LICENSE' -Destination (Join-Path $licenseTarget 'CPP-HTTPLIB-MIT.txt')
          Copy-Item -LiteralPath '.\docs\PROVENANCE.md', '.\docs\source-manifest.json', '.\patches\siliang-engine.patch' -Destination $provenanceTarget
          Copy-Item -LiteralPath $buildReceiptPath -Destination $provenanceTarget
          Copy-Item -LiteralPath '.\docs\CONFIGURATION.md' -Destination $docsTarget
          $releaseNotesPath = ".\docs\releases\$tag.md"
          if (-not (Test-Path -LiteralPath $releaseNotesPath -PathType Leaf)) {
              throw "Release notes were not found: $releaseNotesPath"
          }
          Copy-Item -LiteralPath $releaseNotesPath -Destination $releaseDocsTarget

          $cmakeVersion = (& cmake --version | Select-Object -First 1)
          $buildInfo = @(
              "tag=$tag"
              "commit=$env:GITHUB_SHA"
              "upstream_base=07132750825a4f2d27a547cd9cdde1c6f6001885"
              "backend=${{ matrix.backend }}"
              "openssl_runtime=$opensslVersion"
              "cuda_toolkit=$(if ('${{ matrix.backend }}' -eq 'Cuda') { '13.2.0' } else { 'none' })"
              "cuda_architectures=$effectiveCudaArchitectures"
              "cuda_runtime_cudart=$($cudaRuntimeNames.cudart)"
              "cuda_runtime_cublas=$($cudaRuntimeNames.cublas)"
              "cuda_runtime_cublaslt=$($cudaRuntimeNames.cublasLt)"
              "cuda_backend_loadability=$(if ('${{ matrix.backend }}' -eq 'Cuda') { 'native-library-load-pass' } else { 'not-applicable' })"
              "runner_image=$env:ImageOS"
              "runner_image_version=$env:ImageVersion"
              "cmake=$cmakeVersion"
              'ggml_native=OFF'
              'ggml_backend_dl=ON'
              'ggml_cpu_all_variants=ON'
              'cpu_dispatch=runtime-selected'
              "cpu_dispatch_build_host_selection=$selectedCpuVariant"
          )
          [IO.File]::WriteAllLines(
              (Join-Path $provenanceTarget 'BUILD-INFO.txt'),
              $buildInfo,
              [Text.UTF8Encoding]::new($false)
          )

          # Smoke the assembled package with a deliberately isolated PATH so
          # missing adjacent runtime DLLs cannot be masked by runner software.
          $originalPath = $env:PATH
          Push-Location $binTarget
          try {
              $env:PATH = "$binTarget;$env:SystemRoot\System32;$env:SystemRoot"
              $requiredExpertCacheOptions = @(
                  '--expert-cache'
                  '--no-expert-cache'
                  '--expert-cache-l2-mib'
                  '--expert-cache-l2-policy'
                  '--expert-cache-l1-k'
                  '--expert-cache-exchange-r'
                  '--expert-cache-elevator-p'
                  '--expert-cache-l1-policy'
                  '--expert-cache-roll'
                  '--expert-cache-memory-report'
                  '--no-expert-cache-memory-report'
                  '--expert-cache-deferred-wait'
                  '--no-expert-cache-deferred-wait'
              )
              foreach ($executableName in @('llama-server.exe', 'llama-cli.exe')) {
                  & (Join-Path $binTarget $executableName) --version
                  if ($LASTEXITCODE -ne 0) {
                      throw "$executableName --version failed from the assembled package with exit code $LASTEXITCODE."
                  }
                  $helpText = @(& (Join-Path $binTarget $executableName) --help 2>&1) -join "`n"
                  if ($LASTEXITCODE -ne 0) {
                      throw "$executableName --help failed from the assembled package with exit code $LASTEXITCODE."
                  }
                  foreach ($option in $requiredExpertCacheOptions) {
                  $helpPattern = '(?m)(?<![A-Za-z0-9-])' + [regex]::Escape($option) + '(?![A-Za-z0-9-])'
                  if (-not [regex]::IsMatch($helpText, $helpPattern)) {
                      throw "$executableName --help does not contain $option."
                  }
                  }
              }
          } finally {
              $env:PATH = $originalPath
              Pop-Location
          }

          $zipPath = Join-Path $env:RUNNER_TEMP "$artifactName.zip"
          Compress-Archive -LiteralPath $packageRoot -DestinationPath $zipPath -CompressionLevel Optimal
          $digest = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$zipPath.sha256"
          [IO.File]::WriteAllText(
              $checksumPath,
              "$digest  $([IO.Path]::GetFileName($zipPath))`n",
              [Text.UTF8Encoding]::new($false)
          )

          "artifact_name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checksum_path=$checksumPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30

  publish-checksums:
    name: Publish release checksums
    needs: package-windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: siliang-engine-${{ github.ref_name }}-windows-x64-*
          path: ${{ runner.temp }}/siliang-packages
          merge-multiple: true

      - name: Create SHA256SUMS
        id: checksums
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'siliang-packages') -Filter '*.zip' -File)
          if ($packages.Count -ne 2) {
              throw "Expected two release packages, found $($packages.Count)."
          }
          $lines = foreach ($package in ($packages | Sort-Object -Property Name)) {
              $digest = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$digest  $($package.Name)"
          }
          $checksumPath = Join-Path $env:RUNNER_TEMP 'SHA256SUMS'
          [IO.File]::WriteAllLines($checksumPath, $lines, [Text.UTF8Encoding]::new($false))
          "checksum_path=$checksumPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v4
        with:
          name: siliang-engine-${{ github.ref_name }}-SHA256SUMS
          path: ${{ steps.checksums.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30
